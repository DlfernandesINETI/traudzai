<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Traduzaí — Tradutor Simultâneo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0d07;
  --surface: #111a0e;
  --surface2: #162011;
  --border: #1e3318;
  --accent: #ffc20e;
  --text: #f0f0e8;
  --muted: #7a8a72;
  --green: #22c55e;
  --red: #ef4444;
}

html, body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  user-select: none;
  -webkit-user-select: none;
}

.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

/* SPLASH */
#splash {
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
  gap: 1.5rem;
  text-align: center;
}

.logo { font-size: 4rem; }
.app-title { font-size: 2.2rem; font-weight: 900; color: var(--accent); }
.app-sub { font-size: 0.88rem; color: var(--muted); max-width: 300px; line-height: 1.6; }

.form-wrap { display: flex; flex-direction: column; gap: 0.8rem; width: 100%; max-width: 340px; }

.idioma-select, .form-input {
  width: 100%;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 0.9rem 1rem;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text);
  outline: none;
  text-align: center;
}

.form-input.codigo { text-transform: uppercase; letter-spacing: 0.2em; font-size: 1.1rem; }
.idioma-select:focus, .form-input:focus { border-color: var(--accent); }

.btn-entrar {
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 14px;
  padding: 1rem;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 900;
  cursor: pointer;
  width: 100%;
}

.idiomas-pills { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; max-width: 340px; }
.pill { background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 0.25rem 0.7rem; font-size: 0.75rem; font-weight: 700; color: var(--muted); }

/* SALA */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.8rem 1.2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
  flex-shrink: 0;
}

.back-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.4rem 0.7rem;
  font-size: 0.8rem;
  color: var(--muted);
  cursor: pointer;
  font-family: inherit;
  font-weight: 700;
}

.sala-codigo { font-weight: 900; color: var(--accent); font-size: 0.9rem; }
.sala-idioma { font-size: 0.72rem; color: var(--muted); }

.status-pill {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 0.3rem 0.7rem;
  border-radius: 99px;
  background: var(--surface2);
  border: 1px solid var(--border);
}

.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot.gravando { background: var(--red); box-shadow: 0 0 8px var(--red); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* MENSAGENS */
.mensagens {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}

.msg-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1rem 1.2rem;
  border-left: 4px solid var(--accent);
}

.msg-item.minha { background: var(--surface2); border-left-color: var(--green); }

.msg-autor {
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--muted);
  margin-bottom: 0.4rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.msg-texto { font-size: 1.1rem; font-weight: 700; line-height: 1.5; }
.msg-original { font-size: 0.72rem; color: var(--muted); margin-top: 0.4rem; font-style: italic; }

.empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
.empty-icon { font-size: 3rem; margin-bottom: 0.5rem; }
.empty-text { font-size: 0.85rem; line-height: 1.7; }

/* CONTROLES */
.controles {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 1.2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.8rem;
  flex-shrink: 0;
}

.mic-status { font-size: 0.78rem; color: var(--muted); font-weight: 700; text-align: center; min-height: 1.2em; }

/* Botão grande estilo WhatsApp */
.mic-btn-wrap { position: relative; display: flex; align-items: center; justify-content: center; }

.mic-btn {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  font-size: 2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s, background 0.2s;
  touch-action: none;
  -webkit-touch-callout: none;
  box-shadow: 0 4px 20px rgba(255,194,14,0.4);
}

.mic-btn.gravando {
  background: var(--red);
  transform: scale(1.15);
  box-shadow: 0 0 0 12px rgba(239,68,68,0.2), 0 4px 20px rgba(239,68,68,0.4);
  animation: micPulse 1s ease-in-out infinite;
}

@keyframes micPulse {
  0%,100% { box-shadow: 0 0 0 8px rgba(239,68,68,0.2); }
  50% { box-shadow: 0 0 0 20px rgba(239,68,68,0); }
}

.mic-hint { font-size: 0.72rem; color: var(--muted); text-align: center; }

.sala-badge {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 0.2rem 0.8rem;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--muted);
}

/* Toast */
.toast {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.7rem 1.2rem;
  font-size: 0.82rem;
  font-weight: 700;
  transition: transform 0.3s;
  z-index: 100;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.ok { border-color: var(--green); color: var(--green); }
.toast.erro { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>

    <div class="app-title">Traduzaí</div>

  </div>
  <div class="form-wrap">

</div>

<!-- SALA -->
<div id="sala" class="screen">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:0.6rem">
      <button class="back-btn" id="btnSair" onclick="sair()">← Sair</button>
      <div>
        <div class="sala-codigo" id="topSala">—</div>
        <div class="sala-idioma" id="topIdioma">—</div>
      </div>
    </div>
    <div class="status-pill">
      <div class="dot online" id="statusDot"></div>
      <span id="statusLabel">Online</span>
    </div>
  </div>

  <div class="mensagens" id="mensagens">
    <div class="empty-state">
      <div class="empty-icon">🎙️</div>
      <div class="empty-text">Segure o botão e fale.<br>Todos receberão no seu idioma.</div>
    </div>
  </div>

  <div class="controles">
    <div class="mic-status" id="micStatus">Segure o botão para falar</div>
    <div class="mic-btn-wrap">
      <button class="mic-btn" id="micBtn">🎙️</button>
    </div>
    <div class="mic-hint" id="micHint">Segure para falar • Solte para enviar</div>
    <span class="sala-badge" id="salaBadge">—</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">

const IDIOMAS = {
  pt: { nome: "Português", bandeira: "🇧🇷", sub: "Fale no seu idioma. Todos entendem no deles.", nome_placeholder: "Seu nome", sala_placeholder: "SALA01", entrar: "Entrar na sala →", segure: "Segure o botão para falar", solte: "Segure para falar • Solte para enviar", sair: "← Sair", online: "Online", gravando: "Gravando", transcrevendo: "⏳ Transcrevendo…", enviado: "✅ Enviado!", nenhum: "Nenhum áudio detectado", erro: "Erro ao enviar", segure_hint: "Segure o botão para falar" },
  en: { nome: "English", bandeira: "🇺🇸", sub: "Speak your language. Everyone understands theirs.", nome_placeholder: "Your name", sala_placeholder: "ROOM01", entrar: "Join room →", segure: "Hold button to speak", solte: "Hold to speak • Release to send", sair: "← Leave", online: "Online", gravando: "Recording", transcrevendo: "⏳ Transcribing…", enviado: "✅ Sent!", nenhum: "No audio detected", erro: "Send error", segure_hint: "Hold button to speak" },
  es: { nome: "Español", bandeira: "🇪🇸", sub: "Habla tu idioma. Todos entienden el suyo.", nome_placeholder: "Tu nombre", sala_placeholder: "SALA01", entrar: "Entrar a la sala →", segure: "Mantén para hablar", solte: "Mantén para hablar • Suelta para enviar", sair: "← Salir", online: "En línea", gravando: "Grabando", transcrevendo: "⏳ Transcribiendo…", enviado: "✅ Enviado!", nenhum: "Sin audio", erro: "Error al enviar", segure_hint: "Mantén el botón para hablar" },
  de: { nome: "Deutsch", bandeira: "🇩🇪", sub: "Sprechen Sie Ihre Sprache. Alle verstehen ihre.", nome_placeholder: "Ihr Name", sala_placeholder: "RAUM01", entrar: "Raum betreten →", segure: "Halten zum Sprechen", solte: "Halten zum Sprechen • Loslassen zum Senden", sair: "← Verlassen", online: "Online", gravando: "Aufnahme", transcrevendo: "⏳ Transkribieren…", enviado: "✅ Gesendet!", nenhum: "Kein Audio", erro: "Sendefehler", segure_hint: "Taste gedrückt halten zum Sprechen" },
  fr: { nome: "Français", bandeira: "🇫🇷", sub: "Parlez votre langue. Tout le monde comprend la sienne.", nome_placeholder: "Votre nom", sala_placeholder: "SALLE01", entrar: "Entrer dans la salle →", segure: "Maintenir pour parler", solte: "Maintenez pour parler • Relâchez pour envoyer", sair: "← Quitter", online: "En ligne", gravando: "Enregistrement", transcrevendo: "⏳ Transcription…", enviado: "✅ Envoyé!", nenhum: "Aucun audio", erro: "Erreur d'envoi", segure_hint: "Maintenir le bouton pour parler" },
  zh: { nome: "中文", bandeira: "🇨🇳", sub: "用您的语言说话。每个人都能理解自己的语言。", nome_placeholder: "您的姓名", sala_placeholder: "房间01", entrar: "进入房间 →", segure: "按住说话", solte: "按住说话 • 松开发送", sair: "← 退出", online: "在线", gravando: "录音中", transcrevendo: "⏳ 转录中…", enviado: "✅ 已发送!", nenhum: "未检测到音频", erro: "发送错误", segure_hint: "按住按钮说话" },
  ar: { nome: "العربية", bandeira: "🇸🇦", rtl: true, sub: "تحدث بلغتك. الجميع يفهم لغته.", nome_placeholder: "اسمك", sala_placeholder: "غرفة01", entrar: "← دخول الغرفة", segure: "اضغط مع الاستمرار للتحدث", solte: "اضغط للتحدث • اترك للإرسال", sair: "خروج →", online: "متصل", gravando: "تسجيل", transcrevendo: "⏳ نسخ…", enviado: "✅ أُرسل!", nenhum: "لم يُكتشف صوت", erro: "خطأ في الإرسال", segure_hint: "اضغط مع الاستمرار للتحدث" },
  pl: { nome: "Polski", bandeira: "🇵🇱", sub: "Mów w swoim języku. Wszyscy rozumieją swój.", nome_placeholder: "Twoje imię", sala_placeholder: "POKÓJ01", entrar: "Wejdź do pokoju →", segure: "Przytrzymaj aby mówić", solte: "Przytrzymaj aby mówić • Puść aby wysłać", sair: "← Wyjdź", online: "Online", gravando: "Nagrywanie", transcrevendo: "⏳ Transkrypcja…", enviado: "✅ Wysłano!", nenhum: "Brak audio", erro: "Błąd wysyłania", segure_hint: "Przytrzymaj przycisk aby mówić" },
  uk: { nome: "Українська", bandeira: "🇺🇦", sub: "Говоріть своєю мовою. Всі розуміють свою.", nome_placeholder: "Ваше ім'я", sala_placeholder: "КІМНАТА01", entrar: "Увійти в кімнату →", segure: "Утримуйте для розмови", solte: "Утримуйте для розмови • Відпустіть для надсилання", sair: "← Вийти", online: "Онлайн", gravando: "Запис", transcrevendo: "⏳ Транскрипція…", enviado: "✅ Надіслано!", nenhum: "Аудіо не виявлено", erro: "Помилка надсилання", segure_hint: "Утримуйте кнопку для розмови" },
};

let meuIdioma = 'pt';
let meuNome = '';
let codigoSala = '';
let db = null;
let salaRef = null;
let pushFn = null;
let msgIds = new Set();
let cacheTraducoes = {};

// Gravação
let mediaRecorder = null;
let audioChunks = [];
let isGravando = false;
let stream = null;

// ===== TROCAR UI =====
window.trocarUI = function() {
  const lang = document.getElementById('meuIdioma').value;
  const info = IDIOMAS[lang];
  if (!info) return;

  // Atualizar textos da splash
  document.getElementById('appSub').textContent = info.sub;
  document.getElementById('meuNome').placeholder = info.nome_placeholder;
  document.getElementById('codigoSala').placeholder = info.sala_placeholder;
  document.getElementById('btnEntrar').textContent = info.entrar;

  // RTL para árabe
  document.body.style.direction = info.rtl ? 'rtl' : 'ltr';
  document.body.style.textAlign = info.rtl ? 'right' : 'left';
};

// ===== ENTRAR =====
window.entrar = async function() {
  meuNome = document.getElementById('meuNome').value.trim();
  codigoSala = document.getElementById('codigoSala').value.trim().toUpperCase();
  meuIdioma = document.getElementById('meuIdioma').value;

  if (!meuNome) { showToast('Digite seu nome!', 'erro'); return; }
  if (codigoSala.length < 3) { showToast('Digite um código!', 'erro'); return; }

  // Pedir permissão do microfone antes de entrar
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e) {
    showToast('Permita o microfone para usar o app!', 'erro');
    return;
  }

  try {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js');
    const { getDatabase, ref, push, onChildAdded } = await import('https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js');

    pushFn = push;
    const app = initializeApp(FIREBASE_CONFIG, 'traduzai-' + Date.now());
    db = getDatabase(app);
    salaRef = ref(db, `traduzai3/${codigoSala}/msgs`);

    onChildAdded(salaRef, async (snapshot) => {
      const msg = snapshot.val();
      const id = snapshot.key;
      if (msgIds.has(id)) return;
      msgIds.add(id);
      await exibirMsg(msg);
    });

    const ui = IDIOMAS[meuIdioma];
    document.getElementById('topSala').textContent = codigoSala;
    document.getElementById('topIdioma').textContent = ui.bandeira + ' ' + ui.nome;
    document.getElementById('salaBadge').textContent = codigoSala;
    document.getElementById('btnSair').textContent = ui.sair;
    document.getElementById('micStatus').textContent = ui.segure_hint;
    document.getElementById('micHint').textContent = ui.solte;
    document.getElementById('statusLabel').textContent = ui.online;

    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('sala').classList.add('active');

    configurarBotaoMic();

  } catch(e) {
    showToast('Erro ao conectar: ' + e.message, 'erro');
  }
};

// ===== BOTÃO MIC (press and hold) =====
function configurarBotaoMic() {
  const btn = document.getElementById('micBtn');

  // Pointer events — funciona em celular e computador
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    btn.setPointerCapture(e.pointerId);
    iniciarGravacao();
  });

  btn.addEventListener('pointerup', (e) => {
    e.preventDefault();
    pararEEnviar();
  });

  btn.addEventListener('pointercancel', (e) => {
    e.preventDefault();
    cancelarGravacao();
  });
}

function iniciarGravacao() {
  if (isGravando || !stream) return;
  isGravando = true;
  audioChunks = [];

  try {
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };
    mediaRecorder.start();

    const btn = document.getElementById('micBtn');
    btn.textContent = '🔴';
    btn.classList.add('gravando');
    document.getElementById('micStatus').textContent = '🔴 ' + IDIOMAS[meuIdioma].gravando + '…';
    document.getElementById('statusDot').className = 'dot gravando';
    document.getElementById('statusLabel').textContent = 'Gravando';
  } catch(e) {
    showToast('Erro ao gravar: ' + e.message, 'erro');
    isGravando = false;
  }
}

async function pararEEnviar() {
  if (!isGravando || !mediaRecorder) return;
  isGravando = false;

  const btn = document.getElementById('micBtn');
  btn.textContent = '⏳';
  btn.classList.remove('gravando');
  document.getElementById('micStatus').textContent = IDIOMAS[meuIdioma].transcrevendo;

  mediaRecorder.stop();

  // Aguardar chunks
  await new Promise(resolve => { mediaRecorder.onstop = resolve; });

  const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });

  // Enviar para Whisper via Worker
  try {
    const resp = await fetch(WORKER_URL, {
      method: 'POST',
      headers: {
        'X-Mode': 'transcricao',
        'X-Lang': meuIdioma,
        'Content-Type': 'audio/webm'
      },
      body: audioBlob
    });

    if (!resp.ok) throw new Error('Erro na transcrição');

    const data = await resp.json();
    const texto = data.transcricao?.trim();

    if (texto && texto.length > 0) {
      // Enviar para Firebase
      pushFn(salaRef, {
        autor: meuNome,
        idioma: meuIdioma,
        bandeira: IDIOMAS[meuIdioma].bandeira,
        texto: texto,
        ts: Date.now()
      });
      document.getElementById('micStatus').textContent = IDIOMAS[meuIdioma].enviado;
    } else {
      document.getElementById('micStatus').textContent = IDIOMAS[meuIdioma].nenhum;
    }
  } catch(e) {
    showToast('Erro: ' + e.message, 'erro');
    document.getElementById('micStatus').textContent = IDIOMAS[meuIdioma].erro;
  }

  setTimeout(() => {
    btn.textContent = '🎙️';
    document.getElementById('micStatus').textContent = IDIOMAS[meuIdioma].segure_hint;
    document.getElementById('statusDot').className = 'dot online';
    document.getElementById('statusLabel').textContent = IDIOMAS[meuIdioma].online;
  }, 1500);
}

function cancelarGravacao() {
  if (!isGravando) return;
  isGravando = false;
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  const btn = document.getElementById('micBtn');
  btn.textContent = '🎙️';
  btn.classList.remove('gravando');
  document.getElementById('micStatus').textContent = 'Segure o botão para falar';
}

// ===== EXIBIR MENSAGEM =====
async function exibirMsg(msg) {
  const container = document.getElementById('mensagens');
  const emptyState = container.querySelector('.empty-state');
  if (emptyState) emptyState.remove();

  const eMinha = msg.autor === meuNome;
  let textoExibir = msg.texto;

  if (msg.idioma !== meuIdioma) {
    const cacheKey = `${msg.ts}_${msg.idioma}_${meuIdioma}`;
    if (cacheTraducoes[cacheKey]) {
      textoExibir = cacheTraducoes[cacheKey];
    } else {
      try {
        const resp = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Mode': 'traducao' },
          body: JSON.stringify({ texto: msg.texto, source: msg.idioma, target: meuIdioma })
        });
        if (resp.ok) {
          const data = await resp.json();
          textoExibir = data.traducao || msg.texto;
          cacheTraducoes[cacheKey] = textoExibir;
        }
      } catch(e) { textoExibir = msg.texto; }
    }
  }

  const isRTL = IDIOMAS[meuIdioma]?.rtl;
  const item = document.createElement('div');
  item.className = `msg-item ${eMinha ? 'minha' : ''} ${isRTL ? 'rtl' : ''}`;
  item.style.direction = isRTL ? 'rtl' : 'ltr';

  item.innerHTML = `
    <div class="msg-autor">
      <span>${msg.bandeira}</span>
      <span>${msg.autor}</span>
      ${!eMinha && msg.idioma !== meuIdioma ? `<span style="opacity:0.5">→ ${IDIOMAS[meuIdioma]?.bandeira}</span>` : ''}
    </div>
    <div class="msg-texto">${textoExibir}</div>
    ${!eMinha && msg.idioma !== meuIdioma ? `<div class="msg-original">${msg.texto}</div>` : ''}
  `;

  container.appendChild(item);
  container.scrollTop = container.scrollHeight;
}

// ===== SAIR =====
window.sair = function() {
  cancelarGravacao();
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  msgIds.clear();
  cacheTraducoes = {};
  document.getElementById('mensagens').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">🎙️</div>
      <div class="empty-text">Segure o botão e fale.<br>Todos receberão no seu idioma.</div>
    </div>`;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('splash').classList.add('active');
};

window.showToast = function(msg, tipo) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${tipo || ''} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
};
</script>
