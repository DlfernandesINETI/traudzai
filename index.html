<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Traduzaí — Tradutor Simultâneo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0d07;
  --surface: #111a0e;
  --surface2: #162011;
  --border: #1e3318;
  --accent: #ffc20e;
  --text: #f0f0e8;
  --muted: #7a8a72;
  --green: #22c55e;
  --red: #ef4444;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}

html, body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

/* ======= SPLASH ======= */
#splash {
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
  gap: 1.5rem;
  text-align: center;
}

.logo { font-size: 4rem; }
.app-title { font-size: 2.2rem; font-weight: 900; color: var(--accent); }
.app-sub { font-size: 0.88rem; color: var(--muted); max-width: 300px; line-height: 1.6; }

.form-wrap { display: flex; flex-direction: column; gap: 0.8rem; width: 100%; max-width: 340px; }

.form-input {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 0.9rem 1rem;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text);
  outline: none;
  width: 100%;
  text-align: center;
}

.form-input:focus { border-color: var(--accent); }
.form-input.codigo { text-transform: uppercase; letter-spacing: 0.2em; font-size: 1.1rem; }

.idioma-select {
  width: 100%;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 0.9rem 1rem;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
  outline: none;
  cursor: pointer;
}

.idioma-select:focus { border-color: var(--accent); }

.btn-entrar {
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 14px;
  padding: 1rem;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 900;
  cursor: pointer;
  width: 100%;
}

.idiomas-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  justify-content: center;
  max-width: 340px;
}

.pill {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 0.25rem 0.7rem;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--muted);
}

/* ======= SALA ======= */
#sala { flex-direction: column; }

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.8rem 1.2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
  flex-shrink: 0;
}

.topbar-left { display: flex; align-items: center; gap: 0.6rem; }

.back-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.4rem 0.7rem;
  font-size: 0.8rem;
  color: var(--muted);
  cursor: pointer;
  font-family: inherit;
  font-weight: 700;
}

.sala-codigo { font-weight: 900; color: var(--accent); font-size: 0.9rem; }
.sala-idioma { font-size: 0.72rem; color: var(--muted); }

.status-pill {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 0.3rem 0.7rem;
  border-radius: 99px;
  background: var(--surface2);
  border: 1px solid var(--border);
}

.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.dot.ativo {
  background: var(--red);
  box-shadow: 0 0 8px var(--red);
  animation: pulse 1s ease-in-out infinite;
}

.dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* LEGENDAS */
.legendas-area {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}

.legenda-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1rem 1.2rem;
  border-left: 4px solid var(--accent);
}

.legenda-item.minha {
  background: var(--surface2);
  border-left-color: var(--green);
}

.legenda-autor {
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--muted);
  margin-bottom: 0.4rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.legenda-texto {
  font-size: 1.1rem;
  font-weight: 700;
  line-height: 1.5;
  color: var(--text);
}

.legenda-original {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 0.4rem;
  font-style: italic;
}

.legenda-interim {
  font-size: 0.95rem;
  color: var(--muted);
  font-style: italic;
  margin-top: 0.3rem;
}

/* RTL */
.rtl { direction: rtl; text-align: right; }

/* CONTROLES */
.controles {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 1rem 1.2rem;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
  flex-shrink: 0;
}

.mic-btn {
  width: 100%;
  padding: 1.1rem;
  border-radius: 16px;
  border: none;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 900;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  transition: transform 0.1s;
  background: var(--accent);
  color: #000;
}

.mic-btn.gravando {
  background: var(--red);
  color: white;
  animation: micPulse 1.5s ease-in-out infinite;
}

@keyframes micPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
  50% { box-shadow: 0 0 0 12px rgba(239,68,68,0); }
}

.mic-btn:active { transform: scale(0.97); }

.interim-preview {
  font-size: 0.82rem;
  color: var(--muted);
  font-style: italic;
  text-align: center;
  min-height: 1.2em;
}

.participantes-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  font-size: 0.72rem;
  color: var(--muted);
}

.part-badge {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 0.2rem 0.6rem;
  font-size: 0.7rem;
  font-weight: 700;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.7rem 1.2rem;
  font-size: 0.82rem;
  font-weight: 700;
  transition: transform 0.3s;
  z-index: 100;
  white-space: nowrap;
}

.toast.show { transform: translateX(-50%) translateY(0); }
.toast.ok { border-color: var(--green); color: var(--green); }
.toast.erro { border-color: var(--red); color: var(--red); }

.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--muted);
}

.empty-icon { font-size: 3rem; margin-bottom: 0.5rem; }
.empty-text { font-size: 0.85rem; line-height: 1.6; }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash" class="screen active">
  <div class="logo">🦜</div>
  <div>
    <div class="app-title">Traduzaí</div>
    <p class="app-sub">Fale no seu idioma. Todos entendem no deles. Em tempo real.</p>
  </div>

  <div class="form-wrap">
    <select class="idioma-select" id="meuIdioma">
      <option value="pt">🇧🇷 Português</option>
      <option value="en">🇺🇸 English</option>
      <option value="es">🇪🇸 Español</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="zh">🇨🇳 中文</option>
      <option value="ar">🇸🇦 العربية</option>
      <option value="pl">🇵🇱 Polski</option>
      <option value="uk">🇺🇦 Українська</option>
    </select>
    <input class="form-input" id="meuNome" maxlength="30" placeholder="Seu nome">
    <input class="form-input codigo" id="codigoSala" maxlength="8" placeholder="SALA01" oninput="this.value=this.value.toUpperCase()">
    <button class="btn-entrar" onclick="entrar()">Entrar na sala →</button>
  </div>

  <div class="idiomas-pills">
    <span class="pill">🇧🇷 PT</span>
    <span class="pill">🇺🇸 EN</span>
    <span class="pill">🇪🇸 ES</span>
    <span class="pill">🇩🇪 DE</span>
    <span class="pill">🇫🇷 FR</span>
    <span class="pill">🇨🇳 ZH</span>
    <span class="pill">🇸🇦 AR</span>
    <span class="pill">🇵🇱 PL</span>
    <span class="pill">🇺🇦 UK</span>
  </div>
</div>

<!-- SALA -->
<div id="sala" class="screen">
  <div class="topbar">
    <div class="topbar-left">
      <button class="back-btn" onclick="sair()">← Sair</button>
      <div>
        <div class="sala-codigo" id="topSala">—</div>
        <div class="sala-idioma" id="topIdioma">—</div>
      </div>
    </div>
    <div class="status-pill">
      <div class="dot online" id="statusDot"></div>
      <span id="statusLabel">Online</span>
    </div>
  </div>

  <div class="legendas-area" id="legendasArea">
    <div class="empty-state">
      <div class="empty-icon">🎙️</div>
      <div class="empty-text">Pressione o botão e fale.<br>Todos ouvirão no seu idioma.</div>
    </div>
  </div>

  <div class="controles">
    <div class="interim-preview" id="interimPreview"></div>
    <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎙️ Pressionar para falar</button>
    <div class="participantes-row" id="participantesRow">
      <span>Sala:</span>
      <span class="part-badge" id="partBadge">—</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
// ============ CONFIG ============
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDJMGcPp6iz4NnjSiDU7ihqQMkTX2rqr0A",
  authDomain: "ambient-axiom-384901.firebaseapp.com",
  databaseURL: "https://ambient-axiom-384901-default-rtdb.firebaseio.com",
  projectId: "ambient-axiom-384901",
  storageBucket: "ambient-axiom-384901.firebasestorage.app",
  messagingSenderId: "914809989128",
  appId: "1:914809989128:web:1415bf7a139fb9899649bd"
};

const TRANSLATE_ENDPOINT = "https://traduzai.dlfernandes.workers.dev/";

// ============ IDIOMAS ============
const IDIOMAS = {
  pt: { nome: "Português", bandeira: "🇧🇷", speechLang: "pt-BR" },
  en: { nome: "English", bandeira: "🇺🇸", speechLang: "en-US" },
  es: { nome: "Español", bandeira: "🇪🇸", speechLang: "es-ES" },
  de: { nome: "Deutsch", bandeira: "🇩🇪", speechLang: "de-DE" },
  fr: { nome: "Français", bandeira: "🇫🇷", speechLang: "fr-FR" },
  zh: { nome: "中文", bandeira: "🇨🇳", speechLang: "zh-CN" },
  ar: { nome: "العربية", bandeira: "🇸🇦", speechLang: "ar-SA", rtl: true },
  pl: { nome: "Polski", bandeira: "🇵🇱", speechLang: "pl-PL" },
  uk: { nome: "Українська", bandeira: "🇺🇦", speechLang: "uk-UA" },
};

// ============ ESTADO ============
let meuIdioma = 'pt';
let meuNome = '';
let codigoSala = '';
let db = null;
let salaRef = null;
let presencaRef = null;
let recognition = null;
let isGravando = false;
let msgIds = new Set();
let cacheTraducoes = {};
let pushFn = null;
let serverTimestampFn = null;

// ============ ENTRAR ============
window.entrar = async function() {
  meuNome = document.getElementById('meuNome').value.trim();
  codigoSala = document.getElementById('codigoSala').value.trim().toUpperCase();
  meuIdioma = document.getElementById('meuIdioma').value;

  if (!meuNome) { showToast('Digite seu nome!', 'erro'); return; }
  if (codigoSala.length < 3) { showToast('Digite um código de sala!', 'erro'); return; }

  try {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js');
    const { getDatabase, ref, push, onChildAdded, set, serverTimestamp } = await import('https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js');

    pushFn = push;
    serverTimestampFn = serverTimestamp;

    const app = initializeApp(FIREBASE_CONFIG, 'traduzai-' + Date.now());
    db = getDatabase(app);
    salaRef = ref(db, `traduzai2/${codigoSala}/falas`);
    presencaRef = ref(db, `traduzai2/${codigoSala}/presenca/${meuNome}`);

    // Registrar presença
    set(presencaRef, {
      nome: meuNome,
      idioma: meuIdioma,
      bandeira: IDIOMAS[meuIdioma].bandeira,
      ts: Date.now()
    });

    // Escutar falas
    onChildAdded(salaRef, async (snapshot) => {
      const fala = snapshot.val();
      const id = snapshot.key;
      if (msgIds.has(id)) return;
      msgIds.add(id);
      await exibirFala(fala);
    });

    // Configurar tela
    document.getElementById('topSala').textContent = codigoSala;
    document.getElementById('topIdioma').textContent = IDIOMAS[meuIdioma].bandeira + ' ' + IDIOMAS[meuIdioma].nome;
    document.getElementById('partBadge').textContent = codigoSala;
    if (IDIOMAS[meuIdioma].rtl) document.body.style.direction = 'rtl';

    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('sala').classList.add('active');

  } catch(e) {
    showToast('Erro ao conectar: ' + e.message, 'erro');
  }
};

// ============ EXIBIR FALA ============
async function exibirFala(fala) {
  const area = document.getElementById('legendasArea');
  const emptyState = area.querySelector('.empty-state');
  if (emptyState) emptyState.remove();

  const eMinha = fala.autor === meuNome;
  const idiomaOrigem = fala.idioma;
  let textoExibir = fala.texto;

  // Traduzir se o idioma de origem for diferente do meu
  if (idiomaOrigem !== meuIdioma) {
    // Chave única por mensagem + idioma destino
    const cacheKey = `${fala.ts}_${idiomaOrigem}_${meuIdioma}`;
    if (cacheTraducoes[cacheKey]) {
      textoExibir = cacheTraducoes[cacheKey];
    } else {
      try {
        console.log(`Traduzindo: "${fala.texto}" de ${idiomaOrigem} para ${meuIdioma}`);
        const resp = await fetch(TRANSLATE_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            texto: fala.texto,
            source: idiomaOrigem,
            target: meuIdioma
          })
        });
        console.log('Status Worker:', resp.status);
        if (resp.ok) {
          const data = await resp.json();
          console.log('Tradução recebida:', data);
          textoExibir = data.traducao || fala.texto;
          cacheTraducoes[cacheKey] = textoExibir;
        } else {
          const err = await resp.text();
          console.error('Worker erro:', err);
          textoExibir = '[Sem tradução] ' + fala.texto;
        }
      } catch(e) {
        console.error('Erro na tradução:', e.message);
        textoExibir = '[Erro de tradução] ' + fala.texto;
      }
    }
  }
  // Se idiomaOrigem === meuIdioma: textoExibir já é fala.texto (sem tradução necessária)

  const isRTL = IDIOMAS[meuIdioma]?.rtl;
  const item = document.createElement('div');
  item.className = `legenda-item ${eMinha ? 'minha' : ''} ${isRTL ? 'rtl' : ''}`;

  // textoExibir = traduzido para meu idioma (ou original se mesmo idioma)
  // fala.texto = texto original de quem falou
  const mostrarOriginal = !eMinha && idiomaOrigem !== meuIdioma;

  item.innerHTML = `
    <div class="legenda-autor">
      <span>${fala.bandeira}</span>
      <span>${fala.autor}</span>
      ${mostrarOriginal ? `<span style="opacity:0.5;font-size:0.65rem"> → ${IDIOMAS[meuIdioma]?.bandeira} ${IDIOMAS[meuIdioma]?.nome}</span>` : ''}
    </div>
    <div class="legenda-texto">${textoExibir}</div>
    ${mostrarOriginal ? `<div class="legenda-original">Original: ${fala.texto}</div>` : ''}
  `;

  area.appendChild(item);
  area.scrollTop = area.scrollHeight;
}

// ============ MICROFONE ============
window.toggleMic = function() {
  if (isGravando) pararMic();
  else iniciarMic();
};

function iniciarMic() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showToast('Use o Google Chrome!', 'erro');
    return;
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = IDIOMAS[meuIdioma].speechLang;
  recognition.continuous = true;
  recognition.interimResults = true;

  const textoJaEnviado = new Set();
  let ultimoTextoFinal = '';

  recognition.onstart = () => {
    isGravando = true;
    const btn = document.getElementById('micBtn');
    btn.textContent = '⏹ Parar de falar';
    btn.classList.add('gravando');
    document.getElementById('statusDot').classList.remove('online');
    document.getElementById('statusDot').classList.add('ativo');
    document.getElementById('statusLabel').textContent = 'Ao vivo';
  };

  recognition.onresult = (event) => {
    let interim = '';
    let final = '';

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        final += t + ' ';
      } else {
        interim += t;
      }
    }

    document.getElementById('interimPreview').textContent = interim || '';

    if (final.trim() && pushFn && salaRef) {
      const textoLimpo = final.trim();
      // Verificar duplicação: ignorar se igual ou contido no último texto enviado
      const isDuplicado = textoJaEnviado.has(textoLimpo) ||
        ultimoTextoFinal.includes(textoLimpo) ||
        (textoLimpo.includes(ultimoTextoFinal) && ultimoTextoFinal.length > 3);

      if (!isDuplicado) {
        textoJaEnviado.add(textoLimpo);
        ultimoTextoFinal = textoLimpo;
        // Limpar cache após 10 entradas para não crescer indefinidamente
        if (textoJaEnviado.size > 10) textoJaEnviado.clear();

        pushFn(salaRef, {
          autor: meuNome,
          idioma: meuIdioma,
          bandeira: IDIOMAS[meuIdioma].bandeira,
          texto: textoLimpo,
          ts: Date.now()
        });
      }
      document.getElementById('interimPreview').textContent = '';
    }
  };

  recognition.onend = () => {
    if (isGravando) {
      setTimeout(() => { try { recognition.start(); } catch(e) {} }, 300);
    }
  };

  recognition.onerror = (e) => {
    if (e.error === 'not-allowed') showToast('Permita o microfone nas configurações!', 'erro');
  };

  try { recognition.start(); } catch(e) { showToast('Erro ao iniciar microfone', 'erro'); }
}

function pararMic() {
  isGravando = false;
  if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
  const btn = document.getElementById('micBtn');
  btn.textContent = '🎙️ Pressionar para falar';
  btn.classList.remove('gravando');
  document.getElementById('statusDot').classList.add('online');
  document.getElementById('statusDot').classList.remove('ativo');
  document.getElementById('statusLabel').textContent = 'Online';
  document.getElementById('interimPreview').textContent = '';
}

window.sair = function() {
  pararMic();
  msgIds.clear();
  cacheTraducoes = {};
  document.getElementById('legendasArea').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">🎙️</div>
      <div class="empty-text">Pressione o botão e fale.<br>Todos ouvirão no seu idioma.</div>
    </div>`;
  document.body.style.direction = 'ltr';
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('splash').classList.add('active');
};

window.showToast = function(msg, tipo) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${tipo || ''} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
};
</script>
</body>
</html>
